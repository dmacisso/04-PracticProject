name: Linter
on: push
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v7.0.1
      - name: Install NodeJS
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci  # same as npm install, but only what's in the lock file
      - name: Run linter
        run: npm run lint